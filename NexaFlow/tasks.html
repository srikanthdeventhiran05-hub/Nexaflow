<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks - NexaFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="tasks">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><div class="logo-icon">N</div><div class="logo-text">Nexa<span>Flow</span></div></div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Main</div>
          <div class="nav-item"><a href="dashboard.html" class="nav-link" data-page="dashboard"><span class="nav-icon">📊</span> Dashboard</a></div>
          <div class="nav-item"><a href="projects.html" class="nav-link" data-page="projects"><span class="nav-icon">📁</span> Projects</a></div>
          <div class="nav-item"><a href="tasks.html" class="nav-link active" data-page="tasks"><span class="nav-icon">✅</span> Tasks</a></div>
          <div class="nav-item"><a href="calendar.html" class="nav-link" data-page="calendar"><span class="nav-icon">📅</span> Calendar</a></div>
          <div class="nav-item"><a href="analytics.html" class="nav-link" data-page="analytics"><span class="nav-icon">📈</span> Analytics</a></div>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Account</div>
          <div class="nav-item"><a href="notifications.html" class="nav-link" data-page="notifications"><span class="nav-icon">🔔</span> Notifications <span class="nav-badge notif-badge-count">3</span></a></div>
          <div class="nav-item"><a href="profile.html" class="nav-link" data-page="profile"><span class="nav-icon">👤</span> Profile</a></div>
          <div class="nav-item"><a href="settings.html" class="nav-link" data-page="settings"><span class="nav-icon">⚙️</span> Settings</a></div>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="user-card" onclick="location.href='profile.html'">
          <div class="avatar" id="sidebarUserAvatar">J</div>
          <div class="user-info"><div class="user-name" id="sidebarUserName">John Doe</div><div class="user-email" id="sidebarUserEmail">john@nexaflow.io</div></div>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
      <div class="top-bar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="page-title">Tasks</div>
        <div class="top-bar-actions">
          <div class="search-box"><span class="search-icon">🔍</span><input type="text" placeholder="Search tasks..." id="globalSearch"></div>
          <a href="notifications.html" class="icon-btn" style="text-decoration:none;position:relative">🔔<span class="notif-dot"></span></a>
        </div>
      </div>

      <div class="page-content animate-in">
        <div class="tasks-header">
          <div class="projects-filters">
            <button class="filter-btn active" onclick="filterTasks('all', this)">All</button>
            <button class="filter-btn" onclick="filterTasks('high', this)">High Priority</button>
            <button class="filter-btn" onclick="filterTasks('medium', this)">Medium</button>
            <button class="filter-btn" onclick="filterTasks('low', this)">Low</button>
          </div>
          <button class="btn-primary" onclick="openModal('createTaskModal')">+ New Task</button>
        </div>

        <div class="kanban-board" id="kanbanBoard"></div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="createTaskModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Create New Task</h3>
        <button class="modal-close" onclick="closeModal('createTaskModal')">✕</button>
      </div>
      <form id="createTaskForm">
        <div class="form-group">
          <label>Task Title</label>
          <input type="text" class="input-field" id="taskTitle" placeholder="Enter task title" required>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="form-group">
            <label>Status</label>
            <select class="input-field" id="taskStatus">
              <option value="todo">To Do</option>
              <option value="progress">In Progress</option>
              <option value="review">Review</option>
              <option value="done">Completed</option>
            </select>
          </div>
          <div class="form-group">
            <label>Priority</label>
            <select class="input-field" id="taskPriority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="form-group">
            <label>Tag</label>
            <input type="text" class="input-field" id="taskTag" placeholder="e.g. Frontend">
          </div>
          <div class="form-group">
            <label>Due Date</label>
            <input type="text" class="input-field" id="taskDate" placeholder="e.g. Sep 10">
          </div>
        </div>
        <button type="submit" class="btn-primary w-100" style="margin-top:8px">Create Task</button>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let currentPriorityFilter = 'all';
    let draggedCard = null;

    const columns = [
      { id: 'todo', title: 'To Do', dot: 'todo' },
      { id: 'progress', title: 'In Progress', dot: 'progress' },
      { id: 'review', title: 'Review', dot: 'review' },
      { id: 'done', title: 'Completed', dot: 'done' }
    ];

    const tagColors = { Design: '#8b5cf6', Frontend: '#3b82f6', Backend: '#ef4444', DevOps: '#06b6d4', Docs: '#f59e0b', UX: '#ec4899', Security: '#ef4444' };

    function renderKanban() {
      let tasks = APP.getTasks();
      if (currentPriorityFilter !== 'all') tasks = tasks.filter(t => t.priority === currentPriorityFilter);
      const board = document.getElementById('kanbanBoard');

      board.innerHTML = columns.map(col => {
        const colTasks = tasks.filter(t => t.status === col.id);
        return `
          <div class="kanban-column" data-status="${col.id}" ondragover="handleDragOver(event)" ondrop="handleDrop(event, '${col.id}')">
            <div class="column-header">
              <div class="column-title">
                <span class="column-dot ${col.dot}"></span>
                ${col.title}
              </div>
              <span class="column-count">${colTasks.length}</span>
            </div>
            ${colTasks.map(task => `
              <div class="kanban-card" draggable="true" data-id="${task.id}" ondragstart="handleDragStart(event, ${task.id})" ondragend="handleDragEnd(event)">
                <div class="card-tags">
                  <span class="card-tag" style="background:${task.tagColor || tagColors[task.tag] || '#6366f1'}22;color:${task.tagColor || tagColors[task.tag] || '#6366f1'}">${task.tag}</span>
                </div>
                <h5>${task.title}</h5>
                <div class="card-footer">
                  <span class="card-date">${task.date}</span>
                  <div class="card-assignee" style="background:${task.assigneeColor}">${task.assignee}</div>
                </div>
              </div>
            `).join('')}
            <button class="add-task-btn" onclick="openModalWithStatus('${col.id}')">+ Add Task</button>
          </div>
        `;
      }).join('');
    }

    function filterTasks(filter, btn) {
      currentPriorityFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderKanban();
    }

    function handleDragStart(e, id) {
      draggedCard = id;
      e.target.style.opacity = '0.5';
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragEnd(e) { e.target.style.opacity = '1'; draggedCard = null; }

    function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }

    function handleDrop(e, newStatus) {
      e.preventDefault();
      if (draggedCard === null) return;
      let tasks = APP.getTasks();
      const task = tasks.find(t => t.id === draggedCard);
      if (task) {
        task.status = newStatus;
        APP.saveTasks(tasks);
        renderKanban();
        showToast(`Task moved to ${columns.find(c => c.id === newStatus).title}`, 'success');
      }
    }

    function openModalWithStatus(status) {
      document.getElementById('taskStatus').value = status;
      openModal('createTaskModal');
    }

    document.getElementById('createTaskForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const tasks = APP.getTasks();
      const tag = document.getElementById('taskTag').value.trim() || 'General';
      const tagColors2 = ['#8b5cf6','#3b82f6','#ef4444','#06b6d4','#f59e0b','#ec4899'];
      tasks.push({
        id: Date.now(),
        title: document.getElementById('taskTitle').value.trim(),
        status: document.getElementById('taskStatus').value,
        priority: document.getElementById('taskPriority').value,
        tag: tag,
        tagColor: tagColors[tag] || tagColors2[Math.floor(Math.random() * tagColors2.length)],
        date: document.getElementById('taskDate').value.trim() || 'TBD',
        assignee: 'JD',
        assigneeColor: '#6366f1',
        projectId: null
      });
      APP.saveTasks(tasks);
      renderKanban();
      closeModal('createTaskModal');
      this.reset();
      showToast('Task created successfully!', 'success');
    });

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    renderKanban();
  </script>
</body>
</html>
