<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects - NexaFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="projects">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><div class="logo-icon">N</div><div class="logo-text">Nexa<span>Flow</span></div></div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Main</div>
          <div class="nav-item"><a href="dashboard.html" class="nav-link" data-page="dashboard"><span class="nav-icon">📊</span> Dashboard</a></div>
          <div class="nav-item"><a href="projects.html" class="nav-link active" data-page="projects"><span class="nav-icon">📁</span> Projects</a></div>
          <div class="nav-item"><a href="tasks.html" class="nav-link" data-page="tasks"><span class="nav-icon">✅</span> Tasks</a></div>
          <div class="nav-item"><a href="calendar.html" class="nav-link" data-page="calendar"><span class="nav-icon">📅</span> Calendar</a></div>
          <div class="nav-item"><a href="analytics.html" class="nav-link" data-page="analytics"><span class="nav-icon">📈</span> Analytics</a></div>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Account</div>
          <div class="nav-item"><a href="notifications.html" class="nav-link" data-page="notifications"><span class="nav-icon">🔔</span> Notifications <span class="nav-badge notif-badge-count">3</span></a></div>
          <div class="nav-item"><a href="profile.html" class="nav-link" data-page="profile"><span class="nav-icon">👤</span> Profile</a></div>
          <div class="nav-item"><a href="settings.html" class="nav-link" data-page="settings"><span class="nav-icon">⚙️</span> Settings</a></div>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="user-card" onclick="location.href='profile.html'">
          <div class="avatar" id="sidebarUserAvatar">J</div>
          <div class="user-info"><div class="user-name" id="sidebarUserName">John Doe</div><div class="user-email" id="sidebarUserEmail">john@nexaflow.io</div></div>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
      <div class="top-bar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="page-title">Projects</div>
        <div class="top-bar-actions">
          <div class="search-box"><span class="search-icon">🔍</span><input type="text" placeholder="Search projects..." id="globalSearch"></div>
          <a href="notifications.html" class="icon-btn" style="text-decoration:none;position:relative">🔔<span class="notif-dot"></span></a>
        </div>
      </div>

      <div class="page-content animate-in">
        <div class="projects-header">
          <div class="projects-filters">
            <button class="filter-btn active" onclick="filterProjects('all', this)">All</button>
            <button class="filter-btn" onclick="filterProjects('active', this)">Active</button>
            <button class="filter-btn" onclick="filterProjects('completed', this)">Completed</button>
            <button class="filter-btn" onclick="filterProjects('archived', this)">Archived</button>
          </div>
          <button class="btn-primary" onclick="openModal('createProjectModal')">+ New Project</button>
        </div>

        <div class="projects-grid" id="projectsGrid"></div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="createProjectModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Create New Project</h3>
        <button class="modal-close" onclick="closeModal('createProjectModal')">✕</button>
      </div>
      <form id="createProjectForm">
        <div class="form-group">
          <label>Project Name</label>
          <input type="text" class="input-field" id="projectName" placeholder="Enter project name" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <input type="text" class="input-field" id="projectDesc" placeholder="Brief description" required>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="form-group">
            <label>Icon</label>
            <select class="input-field" id="projectIcon">
              <option value="🌐">🌐 Web</option>
              <option value="📱">📱 Mobile</option>
              <option value="📢">📢 Marketing</option>
              <option value="🔌">🔌 Integration</option>
              <option value="🎨">🎨 Design</option>
              <option value="💡">💡 Research</option>
              <option value="🔧">🔧 Infrastructure</option>
              <option value="📊">📊 Analytics</option>
            </select>
          </div>
          <div class="form-group">
            <label>Color</label>
            <select class="input-field" id="projectColor">
              <option value="#6366f1">Indigo</option>
              <option value="#10b981">Emerald</option>
              <option value="#f59e0b">Amber</option>
              <option value="#ef4444">Red</option>
              <option value="#8b5cf6">Violet</option>
              <option value="#06b6d4">Cyan</option>
              <option value="#ec4899">Pink</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn-primary w-100" style="margin-top:8px">Create Project</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="projectDetailModal">
    <div class="modal" style="max-width:600px">
      <div class="modal-header">
        <h3 id="detailProjectName">Project Details</h3>
        <button class="modal-close" onclick="closeModal('projectDetailModal')">✕</button>
      </div>
      <div id="projectDetailContent"></div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let currentFilter = 'all';

    function renderProjects() {
      const projects = APP.getProjects();
      const filtered = currentFilter === 'all' ? projects : projects.filter(p => p.status === currentFilter);
      const grid = document.getElementById('projectsGrid');

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">📁</div><h3>No projects found</h3><p>Create your first project to get started</p><button class="btn-primary" onclick="openModal(\'createProjectModal\')">+ Create Project</button></div>';
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="project-card" onclick="viewProject(${p.id})">
          <div class="project-header">
            <div class="project-icon" style="background:${p.color}">${p.icon}</div>
            <div class="project-actions">
              <button onclick="event.stopPropagation();deleteProject(${p.id})" title="Delete">🗑</button>
            </div>
          </div>
          <h4>${p.name}</h4>
          <p>${p.desc}</p>
          <div class="project-meta">
            <span>📋 ${p.tasks} tasks</span>
            <span>✅ ${p.completed} done</span>
            <span>👥 ${p.members.length}</span>
          </div>
          <div class="progress-bar-container">
            <div class="progress-bar-header">
              <span>Progress</span>
              <span>${p.progress}%</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill ${p.progress >= 70 ? 'green' : p.progress >= 40 ? '' : 'yellow'}" style="width:${p.progress}%"></div>
            </div>
          </div>
          <div class="team-members">
            ${p.members.map((m, i) => `<div class="member" style="background:${['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4'][i % 6]}">${m}</div>`).join('')}
          </div>
        </div>
      `).join('');
    }

    function filterProjects(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProjects();
    }

    function viewProject(id) {
      const projects = APP.getProjects();
      const p = projects.find(pr => pr.id === id);
      if (!p) return;
      document.getElementById('detailProjectName').textContent = p.name;
      document.getElementById('projectDetailContent').innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
          <div class="project-icon" style="background:${p.color};width:48px;height:48px;font-size:22px">${p.icon}</div>
          <div>
            <h4 style="font-size:18px">${p.name}</h4>
            <p style="color:var(--text-secondary);font-size:13px">Created ${p.created}</p>
          </div>
        </div>
        <p style="color:var(--text-secondary);margin-bottom:20px;line-height:1.7">${p.desc}</p>
        <div class="progress-bar-container" style="margin-bottom:20px">
          <div class="progress-bar-header"><span>Progress</span><span>${p.progress}%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${p.progress}%"></div></div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px">
          <div style="text-align:center;padding:16px;background:var(--bg-tertiary);border-radius:var(--radius-md)">
            <div style="font-size:24px;font-weight:800">${p.tasks}</div>
            <div style="font-size:12px;color:var(--text-tertiary)">Total Tasks</div>
          </div>
          <div style="text-align:center;padding:16px;background:var(--bg-tertiary);border-radius:var(--radius-md)">
            <div style="font-size:24px;font-weight:800;color:var(--success)">${p.completed}</div>
            <div style="font-size:12px;color:var(--text-tertiary)">Completed</div>
          </div>
          <div style="text-align:center;padding:16px;background:var(--bg-tertiary);border-radius:var(--radius-md)">
            <div style="font-size:24px;font-weight:800;color:var(--warning)">${p.tasks - p.completed}</div>
            <div style="font-size:12px;color:var(--text-tertiary)">Remaining</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-weight:600;font-size:14px">Team:</span>
          ${p.members.map((m, i) => `<div class="avatar" style="width:32px;height:32px;font-size:12px;background:${['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4'][i % 6]}">${m}</div>`).join('')}
        </div>
      `;
      openModal('projectDetailModal');
    }

    function deleteProject(id) {
      if (!confirm('Are you sure you want to delete this project?')) return;
      let projects = APP.getProjects();
      projects = projects.filter(p => p.id !== id);
      APP.saveProjects(projects);
      renderProjects();
      showToast('Project deleted', 'success');
    }

    document.getElementById('createProjectForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const projects = APP.getProjects();
      const colors = ['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899'];
      projects.push({
        id: Date.now(),
        name: document.getElementById('projectName').value.trim(),
        desc: document.getElementById('projectDesc').value.trim(),
        color: document.getElementById('projectColor').value,
        icon: document.getElementById('projectIcon').value,
        progress: 0, members: ['JD'], tasks: 0, completed: 0,
        status: 'active',
        created: new Date().toISOString().split('T')[0]
      });
      APP.saveProjects(projects);
      renderProjects();
      closeModal('createProjectModal');
      this.reset();
      showToast('Project created successfully!', 'success');
    });

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    renderProjects();
  </script>
</body>
</html>
