<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - NexaFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-left">
      <h1>Join NexaFlow</h1>
      <p>Create your free account and start managing your projects like a pro. No credit card required.</p>
    </div>
    <div class="auth-right">
      <div class="auth-form">
        <h2>Create Account</h2>
        <p class="auth-subtitle">Fill in your details to get started</p>

        <form id="registerForm">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" class="input-field" id="regName" placeholder="John Doe" required>
          </div>

          <div class="form-group">
            <label>Email Address</label>
            <input type="email" class="input-field" id="regEmail" placeholder="john@example.com" required>
          </div>

          <div class="form-group">
            <label>Password</label>
            <div class="password-toggle">
              <input type="password" class="input-field" id="regPassword" placeholder="Create a strong password" required minlength="6">
              <button type="button" onclick="togglePassword('regPassword', this)">👁</button>
            </div>
          </div>

          <div class="form-group">
            <label>Confirm Password</label>
            <div class="password-toggle">
              <input type="password" class="input-field" id="regConfirm" placeholder="Confirm your password" required>
              <button type="button" onclick="togglePassword('regConfirm', this)">👁</button>
            </div>
          </div>

          <div class="form-check">
            <input type="checkbox" id="agreeTerms" required>
            <label for="agreeTerms" style="margin:0;font-size:14px;color:var(--text-secondary)">I agree to the <a href="#" style="color:var(--primary);font-weight:600">Terms of Service</a> and <a href="#" style="color:var(--primary);font-weight:600">Privacy Policy</a></label>
          </div>

          <button type="submit" class="btn-primary w-100" style="padding:14px;font-size:16px">Create Account</button>
        </form>

        <p class="auth-link" style="margin-top:24px">Already have an account? <a href="login.html">Log In</a></p>
        <p class="auth-link" style="margin-top:12px"><a href="index.html">← Back to Home</a></p>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirm').value;

      if (!name || !email || !password || !confirm) {
        showToast('Please fill in all fields', 'error');
        return;
      }
      if (password.length < 6) {
        showToast('Password must be at least 6 characters', 'error');
        return;
      }
      if (password !== confirm) {
        showToast('Passwords do not match', 'error');
        return;
      }

      const users = JSON.parse(localStorage.getItem('nexaflow_users') || '[]');
      if (users.find(u => u.email === email)) {
        showToast('An account with this email already exists', 'error');
        return;
      }

      users.push({ name, email, password });
      localStorage.setItem('nexaflow_users', JSON.stringify(users));

      localStorage.setItem('nexaflow_profile', JSON.stringify({
        name, email, role: 'Team Member', department: 'General',
        location: '', bio: '', phone: '', joined: new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' }), avatar: null
      }));

      showToast('Account created successfully! Redirecting...', 'success');
      setTimeout(() => window.location.href = 'login.html', 1500);
    });

    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁';
      }
    }

    if (localStorage.getItem('nexaflow_user')) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
