<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - NexaFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="notifications">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><div class="logo-icon">N</div><div class="logo-text">Nexa<span>Flow</span></div></div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Main</div>
          <div class="nav-item"><a href="dashboard.html" class="nav-link" data-page="dashboard"><span class="nav-icon">📊</span> Dashboard</a></div>
          <div class="nav-item"><a href="projects.html" class="nav-link" data-page="projects"><span class="nav-icon">📁</span> Projects</a></div>
          <div class="nav-item"><a href="tasks.html" class="nav-link" data-page="tasks"><span class="nav-icon">✅</span> Tasks</a></div>
          <div class="nav-item"><a href="calendar.html" class="nav-link" data-page="calendar"><span class="nav-icon">📅</span> Calendar</a></div>
          <div class="nav-item"><a href="analytics.html" class="nav-link" data-page="analytics"><span class="nav-icon">📈</span> Analytics</a></div>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Account</div>
          <div class="nav-item"><a href="notifications.html" class="nav-link active" data-page="notifications"><span class="nav-icon">🔔</span> Notifications <span class="nav-badge notif-badge-count">3</span></a></div>
          <div class="nav-item"><a href="profile.html" class="nav-link" data-page="profile"><span class="nav-icon">👤</span> Profile</a></div>
          <div class="nav-item"><a href="settings.html" class="nav-link" data-page="settings"><span class="nav-icon">⚙️</span> Settings</a></div>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="user-card" onclick="location.href='profile.html'">
          <div class="avatar" id="sidebarUserAvatar">J</div>
          <div class="user-info"><div class="user-name" id="sidebarUserName">John Doe</div><div class="user-email" id="sidebarUserEmail">john@nexaflow.io</div></div>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
      <div class="top-bar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="page-title">Notifications</div>
        <div class="top-bar-actions">
          <button class="btn-secondary btn-sm" onclick="markAllRead()">Mark All Read</button>
          <button class="btn-secondary btn-sm" onclick="clearAllNotifications()" style="color:var(--danger)">Clear All</button>
        </div>
      </div>

      <div class="page-content animate-in">
        <div class="notifications-list" id="notificationsList"></div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function renderNotifications() {
      const notifs = APP.getNotifications();
      const list = document.getElementById('notificationsList');

      if (notifs.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="empty-icon">🔔</div><h3>No Notifications</h3><p>You\'re all caught up! Check back later for updates.</p></div>';
        return;
      }

      list.innerHTML = notifs.map(n => `
        <div class="notification-item ${n.read ? '' : 'unread'}" onclick="markRead(${n.id})">
          <div class="notif-icon" style="background:${n.iconBg};color:${n.iconColor}">${n.icon}</div>
          <div class="notif-content">
            <h4>${n.title}</h4>
            <p>${n.message}</p>
            <div class="notif-time">${n.time}</div>
          </div>
          <button class="btn-secondary btn-sm" onclick="event.stopPropagation();deleteNotification(${n.id})" style="color:var(--danger);border-color:var(--danger);flex-shrink:0">Delete</button>
        </div>
      `).join('');
    }

    function markRead(id) {
      let notifs = APP.getNotifications();
      const n = notifs.find(x => x.id === id);
      if (n) { n.read = true; APP.saveNotifications(notifs); renderNotifications(); }
    }

    function markAllRead() {
      let notifs = APP.getNotifications();
      notifs.forEach(n => n.read = true);
      APP.saveNotifications(notifs);
      renderNotifications();
      showToast('All notifications marked as read', 'success');
    }

    function deleteNotification(id) {
      let notifs = APP.getNotifications();
      notifs = notifs.filter(n => n.id !== id);
      APP.saveNotifications(notifs);
      renderNotifications();
      showToast('Notification deleted', 'success');
    }

    function clearAllNotifications() {
      if (!confirm('Clear all notifications?')) return;
      APP.saveNotifications([]);
      renderNotifications();
      showToast('All notifications cleared', 'success');
    }

    renderNotifications();
  </script>
</body>
</html>
