<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NexaFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="auth-container">
    <div class="auth-left">
      <h1>Welcome Back</h1>
      <p>Log in to your NexaFlow account and continue managing your projects and tasks seamlessly.</p>
    </div>
    <div class="auth-right">
      <div class="auth-form">
        <h2>Log In</h2>
        <p class="auth-subtitle">Enter your credentials to access your account</p>

        <form id="loginForm">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" class="input-field" id="loginEmail" placeholder="john@example.com" required>
          </div>

          <div class="form-group">
            <label>Password</label>
            <div class="password-toggle">
              <input type="password" class="input-field" id="loginPassword" placeholder="Enter your password" required>
              <button type="button" onclick="togglePassword('loginPassword', this)">👁</button>
            </div>
          </div>

          <div class="form-check">
            <input type="checkbox" id="rememberMe">
            <label for="rememberMe" style="margin:0;font-size:14px;color:var(--text-secondary)">Remember me</label>
            <a href="#" style="margin-left:auto;font-size:14px;color:var(--primary);font-weight:600">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary w-100" style="padding:14px;font-size:16px">Log In</button>
        </form>

        <p class="auth-link" style="margin-top:24px">Don't have an account? <a href="register.html">Sign Up</a></p>
        <p class="auth-link" style="margin-top:12px"><a href="index.html">← Back to Home</a></p>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showToast('Please fill in all fields', 'error');
        return;
      }

      const users = JSON.parse(localStorage.getItem('nexaflow_users') || '[]');
      const user = users.find(u => u.email === email && u.password === password);

      if (user) {
        APP.saveUser({ name: user.name, email: user.email });
        showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      } else {
        if (users.length === 0 || !users.find(u => u.email === email)) {
          showToast('No account found. Please register first.', 'error');
        } else {
          showToast('Incorrect password. Try again.', 'error');
        }
      }
    });

    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁';
      }
    }

    if (localStorage.getItem('nexaflow_user')) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
