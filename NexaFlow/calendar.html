<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar - NexaFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="calendar">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><div class="logo-icon">N</div><div class="logo-text">Nexa<span>Flow</span></div></div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Main</div>
          <div class="nav-item"><a href="dashboard.html" class="nav-link" data-page="dashboard"><span class="nav-icon">📊</span> Dashboard</a></div>
          <div class="nav-item"><a href="projects.html" class="nav-link" data-page="projects"><span class="nav-icon">📁</span> Projects</a></div>
          <div class="nav-item"><a href="tasks.html" class="nav-link" data-page="tasks"><span class="nav-icon">✅</span> Tasks</a></div>
          <div class="nav-item"><a href="calendar.html" class="nav-link active" data-page="calendar"><span class="nav-icon">📅</span> Calendar</a></div>
          <div class="nav-item"><a href="analytics.html" class="nav-link" data-page="analytics"><span class="nav-icon">📈</span> Analytics</a></div>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Account</div>
          <div class="nav-item"><a href="notifications.html" class="nav-link" data-page="notifications"><span class="nav-icon">🔔</span> Notifications <span class="nav-badge notif-badge-count">3</span></a></div>
          <div class="nav-item"><a href="profile.html" class="nav-link" data-page="profile"><span class="nav-icon">👤</span> Profile</a></div>
          <div class="nav-item"><a href="settings.html" class="nav-link" data-page="settings"><span class="nav-icon">⚙️</span> Settings</a></div>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="user-card" onclick="location.href='profile.html'">
          <div class="avatar" id="sidebarUserAvatar">J</div>
          <div class="user-info"><div class="user-name" id="sidebarUserName">John Doe</div><div class="user-email" id="sidebarUserEmail">john@nexaflow.io</div></div>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
      <div class="top-bar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="page-title">Calendar</div>
        <div class="top-bar-actions">
          <button class="btn-primary btn-sm" onclick="openModal('createEventModal')">+ New Event</button>
          <a href="notifications.html" class="icon-btn" style="text-decoration:none;position:relative">🔔<span class="notif-dot"></span></a>
        </div>
      </div>

      <div class="page-content animate-in">
        <div class="calendar-container">
          <div class="calendar-header">
            <div class="calendar-nav">
              <button onclick="changeMonth(-1)">◀</button>
            </div>
            <h3 id="calendarTitle">September 2026</h3>
            <div class="calendar-nav">
              <button onclick="changeMonth(1)">▶</button>
            </div>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </div>
        <div class="calendar-events">
          <h4>Upcoming Events</h4>
          <div id="eventsList"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="createEventModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Create Event</h3>
        <button class="modal-close" onclick="closeModal('createEventModal')">✕</button>
      </div>
      <form id="createEventForm">
        <div class="form-group">
          <label>Event Title</label>
          <input type="text" class="input-field" id="eventTitle" placeholder="Enter event title" required>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="form-group">
            <label>Date</label>
            <input type="date" class="input-field" id="eventDate" required>
          </div>
          <div class="form-group">
            <label>Time</label>
            <input type="time" class="input-field" id="eventTime">
          </div>
        </div>
        <div class="form-group">
          <label>Color</label>
          <select class="input-field" id="eventColor">
            <option value="#6366f1">Indigo</option>
            <option value="#10b981">Emerald</option>
            <option value="#f59e0b">Amber</option>
            <option value="#ef4444">Red</option>
            <option value="#8b5cf6">Violet</option>
            <option value="#06b6d4">Cyan</option>
          </select>
        </div>
        <button type="submit" class="btn-primary w-100">Create Event</button>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let currentDate = new Date(2026, 8, 1);

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      document.getElementById('calendarTitle').textContent = `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();
      const today = new Date();

      const events = APP.getEvents();
      const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      let html = days.map(d => `<div class="day-header">${d}</div>`).join('');

      for (let i = 0; i < firstDay; i++) {
        const d = daysInPrevMonth - firstDay + i + 1;
        html += `<div class="day-cell other-month"><span class="day-number">${d}</span></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === d;
        const dayEvents = events.filter(e => e.date === dateStr);
        const eventDots = dayEvents.map(e => `<span class="event-dot" style="background:${e.color}"></span>`).join('');

        html += `<div class="day-cell ${isToday ? 'today' : ''}" onclick="showDayEvents('${dateStr}')">
          <span class="day-number">${d}</span>
          <div>${eventDots}</div>
        </div>`;
      }

      const totalCells = firstDay + daysInMonth;
      const remaining = 7 - (totalCells % 7);
      if (remaining < 7) {
        for (let i = 1; i <= remaining; i++) {
          html += `<div class="day-cell other-month"><span class="day-number">${i}</span></div>`;
        }
      }

      document.getElementById('calendarGrid').innerHTML = html;
      renderEventsList();
    }

    function renderEventsList() {
      const events = APP.getEvents();
      const eventsList = document.getElementById('eventsList');
      eventsList.innerHTML = events.sort((a, b) => new Date(a.date) - new Date(b.date)).map(e => {
        const d = new Date(e.date);
        return `
          <div class="event-item">
            <div class="event-color" style="background:${e.color}"></div>
            <div class="event-details">
              <div class="event-title">${e.title}</div>
              <div class="event-time">${d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })} • ${e.time || 'All day'}</div>
            </div>
            <button class="btn-secondary btn-sm" onclick="deleteEvent(${e.id})" style="color:var(--danger);border-color:var(--danger)">Delete</button>
          </div>
        `;
      }).join('');
    }

    function showDayEvents(dateStr) {
      const events = APP.getEvents().filter(e => e.date === dateStr);
      if (events.length === 0) {
        showToast('No events on this day', 'info');
      } else {
        showToast(`${events.length} event(s) on this day: ${events.map(e => e.title).join(', ')}`, 'info');
      }
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function deleteEvent(id) {
      let events = APP.getEvents();
      events = events.filter(e => e.id !== id);
      APP.saveEvents(events);
      renderCalendar();
      showToast('Event deleted', 'success');
    }

    document.getElementById('createEventForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const events = APP.getEvents();
      const timeInput = document.getElementById('eventTime').value;
      const timeStr = timeInput ? new Date('1970-01-01T' + timeInput).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }) : '';
      events.push({
        id: Date.now(),
        title: document.getElementById('eventTitle').value.trim(),
        date: document.getElementById('eventDate').value,
        time: timeStr || 'All day',
        color: document.getElementById('eventColor').value
      });
      APP.saveEvents(events);
      renderCalendar();
      closeModal('createEventModal');
      this.reset();
      showToast('Event created successfully!', 'success');
    });

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    renderCalendar();
  </script>
</body>
</html>
