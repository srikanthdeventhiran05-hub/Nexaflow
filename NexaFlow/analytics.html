<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics - NexaFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body data-page="analytics">
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><div class="logo-icon">N</div><div class="logo-text">Nexa<span>Flow</span></div></div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Main</div>
          <div class="nav-item"><a href="dashboard.html" class="nav-link" data-page="dashboard"><span class="nav-icon">📊</span> Dashboard</a></div>
          <div class="nav-item"><a href="projects.html" class="nav-link" data-page="projects"><span class="nav-icon">📁</span> Projects</a></div>
          <div class="nav-item"><a href="tasks.html" class="nav-link" data-page="tasks"><span class="nav-icon">✅</span> Tasks</a></div>
          <div class="nav-item"><a href="calendar.html" class="nav-link" data-page="calendar"><span class="nav-icon">📅</span> Calendar</a></div>
          <div class="nav-item"><a href="analytics.html" class="nav-link active" data-page="analytics"><span class="nav-icon">📈</span> Analytics</a></div>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Account</div>
          <div class="nav-item"><a href="notifications.html" class="nav-link" data-page="notifications"><span class="nav-icon">🔔</span> Notifications <span class="nav-badge notif-badge-count">3</span></a></div>
          <div class="nav-item"><a href="profile.html" class="nav-link" data-page="profile"><span class="nav-icon">👤</span> Profile</a></div>
          <div class="nav-item"><a href="settings.html" class="nav-link" data-page="settings"><span class="nav-icon">⚙️</span> Settings</a></div>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="user-card" onclick="location.href='profile.html'">
          <div class="avatar" id="sidebarUserAvatar">J</div>
          <div class="user-info"><div class="user-name" id="sidebarUserName">John Doe</div><div class="user-email" id="sidebarUserEmail">john@nexaflow.io</div></div>
        </div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
      <div class="top-bar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="page-title">Analytics</div>
        <div class="top-bar-actions">
          <a href="notifications.html" class="icon-btn" style="text-decoration:none;position:relative">🔔<span class="notif-dot"></span></a>
        </div>
      </div>

      <div class="page-content animate-in">
        <div class="analytics-summary" id="analyticsSummary"></div>

        <div class="analytics-grid">
          <div class="chart-card">
            <div class="chart-header">
              <h3>Tasks Overview</h3>
            </div>
            <canvas id="tasksChart"></canvas>
          </div>
          <div class="chart-card">
            <div class="chart-header">
              <h3>Project Progress</h3>
            </div>
            <canvas id="projectsChart"></canvas>
          </div>
          <div class="chart-card">
            <div class="chart-header">
              <h3>Weekly Activity</h3>
            </div>
            <canvas id="activityChart"></canvas>
          </div>
          <div class="chart-card">
            <div class="chart-header">
              <h3>Task Priority Distribution</h3>
            </div>
            <canvas id="priorityChart"></canvas>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function initAnalytics() {
      const tasks = APP.getTasks();
      const projects = APP.getProjects();

      const totalTasks = tasks.length;
      const doneTasks = tasks.filter(t => t.status === 'done').length;
      const highPriority = tasks.filter(t => t.priority === 'high').length;
      const completionRate = totalTasks > 0 ? Math.round((doneTasks / totalTasks) * 100) : 0;

      document.getElementById('analyticsSummary').innerHTML = `
        <div class="summary-card">
          <div class="summary-icon">📋</div>
          <h3>${totalTasks}</h3>
          <p>Total Tasks</p>
        </div>
        <div class="summary-card">
          <div class="summary-icon">✅</div>
          <h3>${completionRate}%</h3>
          <p>Completion Rate</p>
        </div>
        <div class="summary-card">
          <div class="summary-icon">📁</div>
          <h3>${projects.length}</h3>
          <p>Active Projects</p>
        </div>
        <div class="summary-card">
          <div class="summary-icon">🔥</div>
          <h3>${highPriority}</h3>
          <p>High Priority</p>
        </div>
      `;

      const isDark = document.body.classList.contains('dark-mode');
      const textColor = isDark ? '#94a3b8' : '#64748b';
      const gridColor = isDark ? '#334155' : '#e2e8f0';

      Chart.defaults.color = textColor;
      Chart.defaults.borderColor = gridColor;

      const todoCount = tasks.filter(t => t.status === 'todo').length;
      const progressCount = tasks.filter(t => t.status === 'progress').length;
      const reviewCount = tasks.filter(t => t.status === 'review').length;

      new Chart(document.getElementById('tasksChart'), {
        type: 'doughnut',
        data: {
          labels: ['To Do', 'In Progress', 'Review', 'Completed'],
          datasets: [{
            data: [todoCount, progressCount, reviewCount, doneTasks],
            backgroundColor: ['#3b82f6', '#f59e0b', '#6366f1', '#10b981'],
            borderWidth: 0,
            borderRadius: 4
          }]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true } } } }
      });

      new Chart(document.getElementById('projectsChart'), {
        type: 'bar',
        data: {
          labels: projects.map(p => p.name),
          datasets: [{
            label: 'Progress %',
            data: projects.map(p => p.progress),
            backgroundColor: projects.map(p => p.color + '99'),
            borderColor: projects.map(p => p.color),
            borderWidth: 2,
            borderRadius: 6,
            barThickness: 32
          }]
        },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 100, grid: { color: gridColor } }, x: { grid: { display: false } } } }
      });

      new Chart(document.getElementById('activityChart'), {
        type: 'line',
        data: {
          labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
          datasets: [{
            label: 'Tasks Completed',
            data: [3, 5, 2, 7, 4, 1, 3],
            borderColor: '#6366f1',
            backgroundColor: 'rgba(99, 102, 241, 0.1)',
            fill: true,
            tension: 0.4,
            borderWidth: 3,
            pointRadius: 5,
            pointBackgroundColor: '#6366f1'
          }, {
            label: 'Tasks Created',
            data: [4, 3, 5, 2, 6, 2, 1],
            borderColor: '#10b981',
            backgroundColor: 'rgba(16, 185, 129, 0.1)',
            fill: true,
            tension: 0.4,
            borderWidth: 3,
            pointRadius: 5,
            pointBackgroundColor: '#10b981'
          }]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true } } }, scales: { y: { beginAtZero: true, grid: { color: gridColor } }, x: { grid: { display: false } } } }
      });

      const high = tasks.filter(t => t.priority === 'high').length;
      const med = tasks.filter(t => t.priority === 'medium').length;
      const low = tasks.filter(t => t.priority === 'low').length;

      new Chart(document.getElementById('priorityChart'), {
        type: 'polarArea',
        data: {
          labels: ['High', 'Medium', 'Low'],
          datasets: [{
            data: [high, med, low],
            backgroundColor: ['rgba(239,68,68,0.7)', 'rgba(245,158,11,0.7)', 'rgba(59,130,246,0.7)'],
            borderWidth: 0
          }]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true } } } }
      });
    }
    initAnalytics();
  </script>
</body>
</html>
